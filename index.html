<!DOCTYPE html>
<head>
  <title>QuarrelsomeQuests »</title>
  <link rel="shortcut icon" href="assets/splat.png" type="image/x-icon" />
  <link rel="stylesheet" type="text/css" href="style.css">
  <script type="module" src="script.js"></script>
</head>
<body>
  <div id="welcome" class="tab">
    <h1 id="head-text">QuarrelsomeQuests!</h1>
    <div class="rankDisplayContainer left" id="rankDisplayContainer">
      <div class="centered">
        <h2>Rank Progress:</h2>
        <img id="rankEmblum" src="assets/unranked.png" alt="Rank Icon">
        <div id="rankBarContainer">
          <div id="rankBar"></div>
        </div>
        <p id="rankInfo"><i id="rankTitle">Unranked</i> : <i id="rankProgress">0/0</i></p>
      </div>
    </div>
    <div class="battleRoom right" id="battleRoom"">
      <div class="centered">
        <h2>Battle Room</h2>
        <div id="enemyCardsDisplay" class="card left"></div>
        <div id="playerCardsDisplay" class="card right"></div>
        <p id="battleRoomText">Welcome to the battle room, here you will fight your battles and progress through your quests! (coming soon)</p>
      </div>

    </div>
    <div class="gameDisplayContainer right" id="gameDisplayContainer">
      <div class="centered">
        <h2>Select Battle Type: </h2>
          <div id="battleSelection">

          </div>
      </div>
    </div>
    
  
    <table>
      <tr>
        <th colspan="4">Item Store</th>
      </tr>
      <tr>
        <th class="common-item" id="slot-1"></th>
        <th class="common-item" id="slot-2"></th>
        <th class="common-item" id="slot-3"></th>
        <th class="common-item" id="slot-4"></th>
      </tr>
      <tr>
        <th class="rare-item" id="slot-5"></th>
        <th class="rare-item" id="slot-6"></th>
        <th class="rare-item" id="slot-7"></th>
        <th class="rare-item" id="slot-8"></th>
      </tr>
      <tr>
        <th class="epic-item" id="slot-9"></th>
        <th class="epic-item" id="slot-10"></th>
        <th class="epic-item" id="slot-11"></th>
        <th class="epic-item" id="slot-12"></th>
      </tr>
      <tr>
        <th class="legendary-item" id="slot-13"></th>
        <th class="legendary-item" id="slot-14"></th>
        <th class="legendary-item" id="slot-15"></th>
        <th class="legendary-item" id="slot-16"></th>
      </tr>
    </table>
</body>
